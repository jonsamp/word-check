name: Publish update

jobs:
  resolve_version:
    name: Resolve app version
    environment: production
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: eas/checkout
      - name: Resolve version currently on the store
        id: resolve
        run: |
          VERSION=$(node .eas/scripts/resolve-version.mjs --mode live)
          echo "Resolved version: $VERSION"
          set-output version "$VERSION"

  build_ios:
    name: Publish update
    needs: [resolve_version]
    type: update
    env:
      APP_VERSION: ${{ needs.resolve_version.outputs.version }}
    params:
      channel: production

  deploy_web:
    name: Deploy web
    type: deploy
    params:
      prod: true
